<!DOCTYPE html>

  <head>
    <!-- ==================================================================== -->
    <!-- GTM INTERCEPTOR SDK INTEGRATION (2-HOP ASYNC CDN SNIPPET)            -->
    <!-- Positioned BEFORE the GTM snippet so the command queue stub is ready -->
    <!-- to intercept dataLayer pushes as soon as GTM starts executing.       -->
    <!-- ==================================================================== -->
    <script>
      window.__interceptorLogs = window.__interceptorLogs || [];
      (function(w,d,s,u,id,opt){
        w.gtmInterceptor=w.gtmInterceptor||function(){(w.gtmInterceptor.q=w.gtmInterceptor.q||[]).push(arguments)};
        w.gtmInterceptor.l=1*new Date();w.gtmInterceptor.siteId=id;
        if(id)w.gtmInterceptor('init',Object.assign({siteId:id},opt||{}));
        var f=d.getElementsByTagName(s)[0],j=d.createElement(s);
        j.async=true;j.src=u;f.parentNode.insertBefore(j,f);
      })(window,document,'script','https://gtm-interceptor-sdk.vercel.app/v1/sdk.js','demo-site-01',{
        dataLayerName: 'dataLayer',
        requiredConsentKey: 'analytics_storage',
        assumeGrantedUntilSet: true,
        onEvent: function(event, status) {
          var entry = { event: event, status: status, timestamp: new Date().toISOString() };
          window.__interceptorLogs.push(entry);
          console.log(
            '%c [SDK Interceptor: ' + status.toUpperCase() + '] %c ' + event.name,
            'background: ' + (status === 'forwarded' ? '#10b981' : status === 'queued' ? '#f59e0b' : '#8b5cf6') + '; color: white; font-weight: bold; padding: 2px 5px; border-radius: 3px;',
            'font-weight: bold; color: #38bdf8;',
            event.payload
          );
        },
        onConsentChange: function(state) {
          console.log('%c [SDK Interceptor: Consent State Changed] ', 'background: #3b82f6; color: white; padding: 2px 5px; border-radius: 3px;', state);
        }
      });

      // Dev helpers for testing consent gating and queue flushing
      window.simulateConsentDenial = function() {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(['consent', 'update', { analytics_storage: 'denied', ad_storage: 'denied' }]);
        console.log('%c 🔒 [Consent Mode Helper] analytics_storage set to DENIED', 'background: #ef4444; color: white; padding: 2px 6px; border-radius: 4px;');
      };

      window.simulateConsentGrant = function() {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(['consent', 'update', { analytics_storage: 'granted', ad_storage: 'granted' }]);
        console.log('%c 🔓 [Consent Mode Helper] analytics_storage set to GRANTED (Queue will flush)', 'background: #10b981; color: white; padding: 2px 6px; border-radius: 4px;');
      };
    </script>

    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-KB5PV3ZB');</script>
